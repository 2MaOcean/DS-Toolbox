name: Build DS-Toolbox (Unsigned)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
      - name: Build
        run: |
          xcodebuild clean build \
            -project DSToolbox.xcodeproj \
            -scheme DSToolbox \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DSToolbox.app Payload/
          zip -r DSToolbox-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DSToolbox-unsigned
          path: DSToolbox-unsigned.ipa
